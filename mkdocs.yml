site_name: "Éthéria, Cité des Concepts"
site_description: "Jeu de rôle philosophique sous Fate Accelerated : la cité, les règles, la campagne et les scénarios"
site_url: "https://spigushe.github.io/etheria-cite-concepts/"

# Thème Material pour MkDocs : https://squidfunk.github.io/mkdocs-material/
# Personnalisation en trois palettes de couleurs, avec un toggle pour passer de l'une à l'autre.
theme:
    name: material
    language: fr
    logo: assets/logo.png
    favicon: assets/logo.png
    palette:
        - scheme: epure
          primary: white
          accent: amber
          toggle:
              icon: material/brightness-7
              name: "Passer au style parchemin"
        - scheme: default
          primary: black
          accent: amber
          toggle:
              icon: material/brightness-5
              name: "Passer au style nocturne"
        - scheme: mystere
          primary: black
          accent: amber
          toggle:
              icon: material/brightness-4
              name: "Passer au style épuré"
    # Polices auto-hébergées (voir docs/assets/stylesheets/extra.css et
    # docs/assets/fonts/) : plus d'appel à Google Fonts au build ni au
    # chargement de la page.
    font: false
    features:
        - navigation.instant
        - navigation.tabs
        - navigation.top
        - search.suggest
        - content.code.copy
        - toc.follow

plugins:
    - search
    - to-pdf:
          enabled_if_env: ENABLE_PDF_EXPORT
          # Le changelog reste sur le site, hors du livre.
          exclude_pages:
              - "changelog/"
          output_path: pdf/etheria-jdr.pdf
          back_cover: true

extra_css:
    - assets/stylesheets/callouts.css
    - assets/stylesheets/extra.css

extra_javascript:
    - assets/javascripts/carrousel.js

hooks:
    - scripts/changelog.py # injecte {{ changelog }} depuis CHANGELOG.md
    - scripts/cards.py # génère les cartes (PNG recto + PDF recto-verso)
    - scripts/fiches.py # remplit les fiches PDF des prétirés depuis pretires.json

markdown_extensions:
    - scripts.obsidian_callouts # syntaxe > [!TYPE] Titre (fichier local du repo)
    - admonition # garde !!! note / ??? tip disponibles en secours
    - pymdownx.details
    - pymdownx.superfences
    - attr_list
    - md_in_html
    - toc:
          permalink: true

nav:
    - Ouverture:
          - Accueil: index.md
          - Présentation: presentation.md
    - "I. La cité":
          - Entrer à Éthéria: cite/introduction.md
          - La Société des Explorateurs: cite/societe-des-explorateurs.md
          - Histoire: cite/histoire.md
          - Cartographie: cite/cartographie.md
          - Figures, courants et Gardiens: cite/personnages.md
          - Les sept quartiers:
                - Vue d'ensemble: cite/quartiers/index.md
                - Le Labyrinthe des Identités: cite/quartiers/labyrinthe-des-identites.md
                - La Concorde du Pacte: cite/quartiers/concorde-du-pacte.md
                - La Balance d'Orion: cite/quartiers/balance-d-orion.md
                - Le Gouffre d'Absyr: cite/quartiers/gouffre-d-absyr.md
                - Les Rails de la Décision: cite/quartiers/rails-de-la-decision.md
                - Les Jardins de l'Équité: cite/quartiers/jardins-de-l-equite.md
                - La Citadelle de l'Arété: cite/quartiers/citadelle-de-l-arete.md
    - "II. Jouer":
          - Règles de base: jouer/regles-de-base.md
          - Créer un Aventurier: jouer/creer-un-aventurier.md
          - Réputation philosophique: jouer/reputation.md
          - Évolution des personnages: jouer/evolution.md
          - Prétirés: jouer/pretires.md
          - Exemple de partie: jouer/exemple-de-partie.md
          - Sécurité de table: jouer/securite-de-table.md
    - "III. Mener":
          - Mener la partie: mener/index.md
          - Les dilemmes: mener/dilemmes.md
          - Conséquences et journal: mener/consequences.md
          - Le jugement des Gardiens: mener/gardiens.md
          - Bâtir une opposition: mener/oppositions.md
          - Écrire un scénario: mener/ecrire-un-scenario.md
          - Les cartes à table: mener/cartes.md
          - Secrets de la cité: mener/secrets.md
    - "IV. Campagne":
          - Vue d'ensemble: campagne/index.md
          - Lancer une campagne: campagne/lancer-une-campagne.md
          - Le Labyrinthe des Identités:
                - Trames: campagne/labyrinthe-des-identites.md
                - Concept: campagne/concepts/labyrinthe-des-identites.md
          - La Concorde du Pacte:
                - Trames: campagne/concorde-du-pacte.md
                - Concept: campagne/concepts/concorde-du-pacte.md
          - La Balance d'Orion:
                - Trames: campagne/balance-d-orion.md
                - Concept: campagne/concepts/balance-d-orion.md
          - Le Gouffre d'Absyr:
                - Trames: campagne/gouffre-d-absyr.md
                - Concept: campagne/concepts/gouffre-d-absyr.md
          - Les Rails de la Décision:
                - Trames: campagne/rails-de-la-decision.md
                - Concept: campagne/concepts/rails-de-la-decision.md
          - Les Jardins de l'Équité:
