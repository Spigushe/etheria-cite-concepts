name: Vérifications

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer les dépendances système (export PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Installer Python et les dépendances
        run: |
          uv sync --locked

      - name: Lint Python (ruff)
        run: |
          uv run --no-sync python make.py lint

      - name: Typage Python (ty)
        run: |
          uv run --no-sync python make.py types

      - name: Orthographe (cspell)
        run: |
          uv run --no-sync python make.py spell

      # Version figée (dans make.py) : une nouvelle règle de markdownlint
      # ne doit pas faire échouer un déploiement par surprise.
      - name: Lint Markdown (markdownlint)
        run: |
          uv run --no-sync python make.py mdlint

      # Même build qu'au déploiement (config prod, export PDF compris) :
      # mkdocs-to-pdf revérifie les liens du document fusionné et refuse
      # ce que le build sans PDF laisse passer.
      - name: Build strict (avec export PDF)
        run: |
          uv run --no-sync python make.py build-pdf
