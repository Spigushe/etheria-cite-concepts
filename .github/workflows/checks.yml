name: Vérifications

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installer les dépendances système (export PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Installer Python et les dépendances
        run: |
          uv sync --locked

      - name: Lint Python (ruff)
        run: |
          uv run --no-sync ruff check scripts/
          uv run --no-sync ruff format --check scripts/

      - name: Typage Python (ty)
        run: |
          uv run --no-sync ty check

      - name: Orthographe (cspell)
        run: |
          npx --yes --package cspell --package @cspell/dict-fr-fr -- cspell --config cspell.json --no-progress

      # Version figée : une nouvelle règle de markdownlint ne doit pas
      # faire échouer un déploiement par surprise.
      - name: Lint Markdown (markdownlint)
        run: |
          npx --yes markdownlint-cli2@0.24.1

      # Même build qu'au déploiement (config prod, export PDF compris) :
      # mkdocs-to-pdf revérifie les liens du document fusionné et refuse
      # ce que le build sans PDF laisse passer.
      - name: Build strict (avec export PDF)
        env:
          ENABLE_PDF_EXPORT: "1"
        run: |
          uv run --no-sync python -m mkdocs build --strict
